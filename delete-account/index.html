<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <title>Delete your Hit Goals account</title>
    <style>
      :root { color-scheme: light; --cream: #fbf5eb; --paper: #fff; --ink: #2a1712; --muted: #6e574e; --line: #e7dbc7; --red: #f23b2e; --edge: #b32117; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--cream); color: var(--ink); font-family: Nunito, "Segoe UI", sans-serif; }
      main { width: min(calc(100% - 32px), 480px); margin: 0 auto; padding: 56px 0; }
      .brand { margin-bottom: 42px; font-size: 18px; font-weight: 800; }
      .brand span { color: var(--red); }
      h1 { margin: 0 0 14px; font-family: Onest, "Trebuchet MS", sans-serif; font-size: 36px; line-height: 1.08; letter-spacing: -.03em; }
      p { margin: 0 0 28px; color: var(--muted); font-weight: 600; line-height: 1.55; }
      .card { padding: 24px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); }
      .field { margin-bottom: 18px; }
      label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 800; }
      input { width: 100%; height: 54px; padding: 0 14px; border: 2px solid var(--line); border-radius: 7px; outline: none; color: var(--ink); font: 700 16px Nunito, "Segoe UI", sans-serif; }
      input:focus { border-color: var(--red); box-shadow: 0 0 0 4px #fdf1ef; }
      button { width: 100%; min-height: 54px; padding: 12px 18px; border: 0; border-radius: 7px; background: var(--red); box-shadow: 0 4px 0 var(--edge); color: #fff; cursor: pointer; font: 800 16px Onest, "Trebuchet MS", sans-serif; }
      button:disabled { opacity: .5; cursor: default; }
      .link { min-height: auto; margin-top: 16px; background: transparent; box-shadow: none; color: var(--red); }
      .message { margin: 16px 0 0; font-size: 13px; font-weight: 700; }
      .error { color: var(--edge); }
      .hidden { display: none; }
      .success { padding: 22px 0; text-align: center; }
      .success h2 { margin: 0 0 10px; font: 800 28px Onest, "Trebuchet MS", sans-serif; }
      .success p { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span>Hit</span>Goals</div>
      <h1>Delete your Hit Goals account</h1>
      <p>This permanently deletes your account and all Hit Goals data saved in the cloud. You do not need the app installed.</p>
      <section class="card" id="email-step">
        <div class="field"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" /></div>
        <button id="send">Send deletion code</button><div class="message" id="email-message"></div>
      </section>
      <section class="card hidden" id="code-step">
        <div class="field"><label for="code">Six-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" /></div>
        <button id="remove">Delete account permanently</button><button class="link" id="change">Use a different email</button><div class="message" id="code-message"></div>
      </section>
      <section class="card success hidden" id="success"><h2>Account deleted</h2><p>Your Hit Goals account and saved cloud data have been permanently deleted.</p></section>
    </main>
    <script>
      const API_URL = 'https://pohzrudpdqvgyhkmurtp.supabase.co/functions/v1/account-deletion';
      const emailStep = document.querySelector('#email-step'), codeStep = document.querySelector('#code-step'), success = document.querySelector('#success'), email = document.querySelector('#email'), code = document.querySelector('#code'), send = document.querySelector('#send'), remove = document.querySelector('#remove'), change = document.querySelector('#change'), emailMessage = document.querySelector('#email-message'), codeMessage = document.querySelector('#code-message');
      async function post(body) { const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Something went wrong.'); return data; }
      send.onclick = async () => { send.disabled = true; emailMessage.textContent = ''; try { await post({ action: 'request-code', email: email.value }); emailStep.classList.add('hidden'); codeStep.classList.remove('hidden'); code.focus(); } catch (error) { emailMessage.textContent = error.message; emailMessage.className = 'message error'; } finally { send.disabled = false; } };
      remove.onclick = async () => { remove.disabled = true; codeMessage.textContent = ''; try { await post({ action: 'confirm-code', email: email.value, code: code.value }); codeStep.classList.add('hidden'); success.classList.remove('hidden'); } catch (error) { codeMessage.textContent = error.message; codeMessage.className = 'message error'; remove.disabled = false; } };
      change.onclick = () => { code.value = ''; codeMessage.textContent = ''; codeStep.classList.add('hidden'); emailStep.classList.remove('hidden'); email.focus(); };
    </script>
  </body>
</html>
